[profiles.user]
user_id = "@amandin:matrix.org"

[settings.users."@amandin:matrix.org"]
name = "amandin"
color = "light-magenta"

[settings]
notifications.enabled = true
username_display = "displayname"

[settings.image_preview]
protocol.type = "halfblocks"
protocol.font_size = [ 11, 26 ]
size = { height = 10, width = 66 }

[settings.sort]
rooms = ["recent", "unread", "favorite", "lowpriority", "name"]

[dirs]
downloads = "~/Downloads"

[layout]
style = "new"

# workaround to make use space for my prefix / leader key
[macros."normal|select|visual"]
"<Space>" = "\\"

[macros."normal|visual"]
"\\a" = ":react "
"\\r" = ":reply<CR>"
"\\e" = ":edit<CR>"
"\\d" = ":redact<CR>"
"\\o" = ":open<CR>"
"\\O" = ":download<CR>"
"\\q" = ":qa<CR>"
"s" = "<C-w>m"
"gs" = "\"+"
"<C-i>" = ":unreads<CR>"
"<C-k>" = ":chats<CR>"
"<C-c>" = ":cancel<CR>"
"j" = "gj"
"k" = "gk"
"$" = "g$"
"^" = "g^"
"0" = "g0"

[macros.insert]
"<S-CR>" = "<C-v><C-j>"
