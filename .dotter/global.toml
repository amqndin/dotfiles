[wezterm.files]
wezterm = "~/.config/wezterm"

[clink.files]
clink = "~/AppData/Local/clink"

[nvim.files]
nvim = "~/.config/nvim"
"nvim/assets/presence/jmc.png" = { target = "~/.config/nvim/assets/presence/jmc.png", type = "symbolic" }
"nvim/assets/presence/mcfunction.png" = { target = "~/.config/nvim/assets/presence/mcfunction.png", type = "symbolic" }

[discord.files]
"discord/settings/settings.json" = { target = "~/.config/equibop/settings/settings.json", type = "symbolic" }
"discord/settings/quickCss.css" = "~/.config/equibop/settings/quickCss.css"
"discord/themes" = "~/.config/equibop/themes"

[niri.files]
niri = "~/.config/niri"

[kanata.files]
"kanata/kanata.kbd" = "~/.config/kanata/kanata.kbd"

[kanata.variables]
kanata_version = "1.9.0"

[fastfetch.files]
fastfetch = "~/.config/fastfetch"

[iamb.files]
"iamb/config.toml" = "~/AppData/Roaming/iamb/config.toml"

[starship.files]
"starship/config.toml" = "~/.config/starship.toml"
